
name: university-prod

services:
  front:
    build:
      context: ../front
      dockerfile: dockerfile.prod

    image: university-front:prod
    container_name: university-front-prod

    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://nginx

    ports:
      - "127.0.0.1:3001:3000"

    depends_on:
      nginx:
        condition: service_started

    restart: unless-stopped

  api:
    build:
      context: ../api
      dockerfile: dockerfile.prod
      target: app

    image: university-api:prod
    container_name: university-api-prod

    env_file:
      - .env.prod

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:?Missing POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER:?Missing POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}

    expose:
      - "9000"

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  nginx:
    build:
      context: ../api
      dockerfile: dockerfile.prod
      target: web

    image: university-nginx:prod
    container_name: university-nginx-prod

    ports:
      - "127.0.0.1:8001:80"

    depends_on:
      - api

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/up || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: university-postgres-prod

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Missing POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Missing POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}

    volumes:
      - university-postgres-prod-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  university-postgres-prod-data:
