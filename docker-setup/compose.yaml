
services:
  front:
    build:
      context: ../front
      dockerfile: dockerfile.dev

    image: university-front:dev
    container_name: university-front-dev

    env_file:
      - ../front/.env

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"

    develop:
      watch:
        - action: sync
          path: ../front
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
            - package.json
            - package-lock.json

        - action: rebuild
          path: ../front/package.json

        - action: rebuild
          path: ../front/package-lock.json
