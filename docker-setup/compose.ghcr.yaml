name: university-ghcr-test

services:
  front:
    image: ghcr.io/amir-hkn/university-front:${IMAGE_TAG:-development}

    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://nginx

    ports:
      - "127.0.0.1:3003:3000"

    depends_on:
      nginx:
        condition: service_healthy

  api:
    image: ghcr.io/amir-hkn/university-api:${IMAGE_TAG:-development}

    env_file:
      - .env.ghcr

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:?Missing POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER:?Missing POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: ghcr.io/amir-hkn/university-nginx:${IMAGE_TAG:-development}

    ports:
      - "127.0.0.1:8002:80"

    depends_on:
      api:
        condition: service_started

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/up || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Missing POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Missing POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}

    volumes:
      - ghcr-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ghcr-postgres-data: