name: University CI

on:
  push:
    branches:
      - development

  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm run test:run

      - name: Run ESLint
        run: npm run lint

      - name: Production Build
        run: npm run build

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: university_test
          POSTGRES_USER: university_test
          POSTGRES_PASSWORD: ci_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U university_test -d university_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: university_test
      DB_USERNAME: university_test
      DB_PASSWORD: ci_test_password

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, zip, pdo_sqlite, sqlite3, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment
        run: |
          cp .env.example .env
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing --no-interaction

      - name: Run Laravel Tests
        run: php vendor/bin/pest

  docker-build:
    name: Docker Build and Publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}
    needs:
      - frontend-ci
      - backend-ci

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Next.js Image
        uses: docker/build-push-action@v7
        with:
          context: ./front
          file: ./front/dockerfile.prod
          push: true
          tags: |
            ghcr.io/amir-hkn/university-front:development
            ghcr.io/amir-hkn/university-front:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Amir-Hkn/university
          cache-from: type=gha,scope=university-front
          cache-to: type=gha,scope=university-front,mode=max

      - name: Build and Push Laravel Image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/dockerfile.prod
          target: app
          push: true
          tags: |
            ghcr.io/amir-hkn/university-api:development
            ghcr.io/amir-hkn/university-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Amir-Hkn/university
          cache-from: type=gha,scope=university-api
          cache-to: type=gha,scope=university-api,mode=max

      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/dockerfile.prod
          target: web
          push: true
          tags: |
            ghcr.io/amir-hkn/university-nginx:development
            ghcr.io/amir-hkn/university-nginx:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Amir-Hkn/university
          cache-from: type=gha,scope=university-nginx
          cache-to: type=gha,scope=university-nginx,mode=max

  staging-deploy:
    name: Staging Deployment
    runs-on: ubuntu-latest

    needs:
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/development'

    environment: staging

    permissions:
      contents: read
      packages: read

    defaults:
      run:
        working-directory: docker-setup

    env:
      IMAGE_TAG: sha-${{ github.sha }}
      POSTGRES_DB: university_staging
      POSTGRES_USER: university_staging

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Staging Environment
        run: |
          DB_PASSWORD="$(openssl rand -hex 24)"

          echo "::add-mask::$DB_PASSWORD"
          echo "POSTGRES_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"

          APP_KEY="base64:$(openssl rand -base64 32)"

          printf 'APP_KEY=%s\n' "$APP_KEY" > .env.ghcr

      - name: Validate Docker Compose
        run: docker compose -f compose.ghcr.yaml config --quiet

      - name: Pull Docker Images
        run: docker compose -f compose.ghcr.yaml pull

      - name: Start PostgreSQL
        run: |
          docker compose -f compose.ghcr.yaml up \
            -d \
            --wait \
            --wait-timeout 120 \
            db

      - name: Run Laravel Migrations
        run: |
          docker compose -f compose.ghcr.yaml run \
            --rm api php artisan migrate --force

      - name: Start Application Services
        run: |
          docker compose -f compose.ghcr.yaml up \
            -d \
            --wait \
            --wait-timeout 180

      - name: Smoke Test - Application
        run: |
          set -euo pipefail

          echo "Checking Laravel health endpoint..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:8002/up > /dev/null

          echo "Laravel health endpoint: OK"

          echo "Checking Laravel homepage..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:8002/ > /dev/null

          echo "Laravel homepage: OK"

          echo "Checking Next.js homepage..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:3003/ > /tmp/university-frontend.html

          if ! grep -q 'data-app="university-frontend"' /tmp/university-frontend.html; then
            echo "::error::University frontend identity marker not found."
            exit 1
          fi

          echo "Next.js homepage: OK"
          

      - name: Smoke Test - Database
        run: |
          set -euo pipefail
          
          echo "Checking Laravel migration status..."
          
          MIGRATION_STATUS="$(
            docker compose -f compose.ghcr.yaml exec -T api \
              php artisan migrate:status --no-ansi
          )"
          
          printf '%s\n' "$MIGRATION_STATUS"
          
          if printf '%s\n' "$MIGRATION_STATUS" | grep -qi "Pending"; then
            echo "::error::Pending Laravel migrations detected."
            exit 1
          fi
          
          echo "Database migration status: OK"
          

      - name: Show Container Status
        run: docker compose -f compose.ghcr.yaml ps

      - name: Record Deployment Manifest
        run: |
          set -euo pipefail

          FRONT_IMAGE="ghcr.io/amir-hkn/university-front:${IMAGE_TAG}"
          API_IMAGE="ghcr.io/amir-hkn/university-api:${IMAGE_TAG}"
          NGINX_IMAGE="ghcr.io/amir-hkn/university-nginx:${IMAGE_TAG}"

          FRONT_DIGEST="$(
            docker image inspect \
              --format '{{index .RepoDigests 0}}' \
              "$FRONT_IMAGE"
          )"

          API_DIGEST="$(
            docker image inspect \
              --format '{{index .RepoDigests 0}}' \
              "$API_IMAGE"
          )"

          NGINX_DIGEST="$(
            docker image inspect \
              --format '{{index .RepoDigests 0}}' \
              "$NGINX_IMAGE"
          )"

          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg environment "staging" \
            --arg commit "$GITHUB_SHA" \
            --arg image_tag "$IMAGE_TAG" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg deployed_at "$DEPLOYED_AT" \
            --arg frontend "$FRONT_DIGEST" \
            --arg backend "$API_DIGEST" \
            --arg nginx "$NGINX_DIGEST" \
            '{
              repository: $repository,
              environment: $environment,
              commit_sha: $commit,
              image_tag: $image_tag,
              workflow_run_id: $run_id,
              deployed_at_utc: $deployed_at,
              images: {
                frontend: $frontend,
                backend: $backend,
                nginx: $nginx
              }
            }' > deployment-manifest.json

          {
            echo "## Staging Deployment"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Environment | staging |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Image Tag | \`$IMAGE_TAG\` |"
            echo "| Deployed At (UTC) | $DEPLOYED_AT |"
            echo ""
            echo "### Docker Image Digests"
            echo ""
            echo "- Frontend: \`$FRONT_DIGEST\`"
            echo "- Backend: \`$API_DIGEST\`"
            echo "- Nginx: \`$NGINX_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Deployment manifest created successfully."
          
          
      - name: Upload Deployment Manifest
        uses: actions/upload-artifact@v7
        with:
          name: staging-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: docker-setup/deployment-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Show Logs on Failure
        if: failure()
        run: |
          docker compose -f compose.ghcr.yaml ps

          docker compose -f compose.ghcr.yaml logs --tail=100

      - name: Cleanup Staging Environment
        if: always()
        run: |
          if [ -n "${POSTGRES_PASSWORD:-}" ]; then
            docker compose -f compose.ghcr.yaml down \
              --volumes \
              --remove-orphans
          fi