name: University CI

on:
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Show Working Directory
        run: pwd

      - name: List Project Files
        run: ls -la

      - name: Check Project Directories
        run: ls api front docker-setup