name: University CI

on:
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Production Build
        run: npm run build


  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, zip, pdo_sqlite, sqlite3, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run Laravel Tests
        run: php artisan test



  docker-build:
    name: Docker Build
    needs:
      - frontend-ci
      - backend-ci

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Next.js Image
        uses: docker/build-push-action@v7
        with:
          context: ./front
          file: ./front/dockerfile.prod
          push: false
          load: true
          tags: university-front:ci
          cache-from: type=gha,scope=university-front
          cache-to: type=gha,scope=university-front,mode=max

      - name: Build Laravel Image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/dockerfile.prod
          target: app
          push: false
          load: true
          tags: university-api:ci
          cache-from: type=gha,scope=university-api
          cache-to: type=gha,scope=university-api,mode=max

      - name: Build Nginx Image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/dockerfile.prod
          target: web
          push: false
          load: true
          tags: university-nginx:ci
          cache-from: type=gha,scope=university-nginx
          cache-to: type=gha,scope=university-nginx,mode=max

      - name: List Docker Images
        run: docker image ls
