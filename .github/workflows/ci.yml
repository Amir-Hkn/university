name: University CI

on:
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Production Build
        run: npm run build


  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, zip, pdo_sqlite, sqlite3, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run Laravel Tests
        run: php artisan test


  docker-build:
    name: Docker Build
    needs:
      - frontend-ci
      - backend-ci

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Check Docker Version
        run: docker version

      - name: Build Next.js Image
        run: docker build -f front/dockerfile.prod -t university-front:ci ./front

      - name: Build Laravel Image
        run: docker build -f api/dockerfile.prod --target app -t university-api:ci ./api

      - name: Build Nginx Image
        run: docker build -f api/dockerfile.prod --target web -t university-nginx:ci ./api

      - name: List Docker Images
        run: docker image ls
